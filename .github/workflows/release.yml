name: Release & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          py_ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          rs_ver = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          print(f"tag={tag}, pyproject={py_ver}, cargo={rs_ver}")
          assert tag == py_ver == rs_ver, f"Version mismatch: tag={tag}, pyproject={py_ver}, cargo={rs_ver}"
          PY
      - name: Run Rust unit tests
        run: cargo test --lib
      - name: Build wheel and run Python tests
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          WHEEL=$(ls dist/marine_extremes-*.whl)
          python -m pip install "${WHEEL}[io,dev]"
          pytest -q
          python examples/quickstart.py

  wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - os: macos-14
            target: aarch64
            manylinux: off
          - os: macos-14
            target: x86_64
            manylinux: off
          - os: windows-latest
            target: x64
            manylinux: off
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/marine-extremes
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify distributions with twine
        run: |
          python -m pip install --upgrade twine
          ls -lh dist/
          twine check --strict dist/*
      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Attach wheels and sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
